<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Ing. Študijná Skupina – Prístup</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f2f5; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: white; padding: 32px 28px 28px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 420px; box-sizing: border-box; position: relative; text-align: center; }
    
    .lang-container { position: absolute; top: 18px; right: 20px; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: bold; color: #666; }
    .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #1a73e8; transition: .3s; border-radius: 22px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #34a853; }
    input:checked + .slider:before { transform: translateX(22px); }

    h2 { margin-top: 10px; color: #111; font-size: 22px; }
    p { color: #666; font-size: 14px; line-height: 1.4; margin-bottom: 24px; }
    
    input[type="text"], input[type="email"], button { width: 100%; padding: 12px 14px; margin-top: 12px; border-radius: 8px; border: 1px solid #ccd0d5; box-sizing: border-box; font-size: 14px; }
    input:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,0.12); }

    button { background: #1a73e8; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 18px; transition: background 0.2s; }
    button:hover { background: #1557b0; }
    button:disabled { background: #999; cursor: not-allowed; }

    .msg { margin-top: 18px; padding: 12px; border-radius: 8px; display: none; font-size: 14px; line-height: 1.4; text-align: left; }
    .error { background: #ffe6e6; color: #cc0000; border: 1px solid #ffcccc; }
    .success { background: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
  </style>
</head>
<body>

<div class="card">
  <div class="lang-container">
    <span>SK</span>
    <label class="switch">
      <input type="checkbox" id="langToggle" onchange="toggleLanguage()">
      <span class="slider"></span>
    </label>
    <span>EN</span>
  </div>
  
  <h2 id="heading">Žiadosť o prístup do študijnej skupiny</h2>
  <p id="subheading">Zadajte svoje meno, priezvisko a Google e-mail pre automatické priradenie prístupu.</p>
  
  <input type="text" id="firstName" placeholder="Krstné meno (napr. Ján)">
  <input type="text" id="lastName" placeholder="Priezvisko (napr. Novák)">
  <input type="email" id="email" placeholder="Google / Univerzitný e-mail">
  <button id="submitBtn" onclick="requestAccess()">Aktivovať prístup</button>

  <div id="statusMsg" class="msg"></div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJC2GUv-U_aCqnYoGn9P7OkJVf1HD4O9mW44oFieXej_qEji-OgjnVYdM8sjhCABnd/exec";

  let currentLang = 'sk';

  const translations = {
    sk: {
      title: "Ing. Študijná Skupina – Prístup",
      heading: "Žiadosť o prístup do študijnej skupiny",
      subheading: "Zadajte svoje meno, priezvisko a e-mail pre automatické sprístupnenie Google Chat a Drive.",
      firstNamePlaceholder: "Krstné meno (napr. Ján)",
      lastNamePlaceholder: "Priezvisko (napr. Novák)",
      emailPlaceholder: "E-mail (napr. jan.novak@gmail.com)",
      btnText: "Aktivovať prístup",
      btnLoading: "Overujem a pridávam...",
      fillAll: "Prosím, vyplňte všetky polia.",
      netError: "Chyba pripojenia. Skúste to znova."
    },
    en: {
      title: "Master's Study Group – Access",
      heading: "Study Group Access Request",
      subheading: "Enter your first name, last name, and email for automatic access to Google Chat & Drive.",
      firstNamePlaceholder: "First Name (e.g. John)",
      lastNamePlaceholder: "Last Name (e.g. Doe)",
      emailPlaceholder: "Email (e.g. john.doe@gmail.com)",
      btnText: "Activate Access",
      btnLoading: "Verifying & Adding...",
      fillAll: "Please fill in all fields.",
      netError: "Network error. Please try again."
    }
  };

  function toggleLanguage() {
    currentLang = document.getElementById('langToggle').checked ? 'en' : 'sk';
    updateTexts();
  }

  function updateTexts() {
    const t = translations[currentLang];
    document.getElementById('pageTitle').innerText = t.title;
    document.getElementById('heading').innerText = t.heading;
    document.getElementById('subheading').innerText = t.subheading;
    document.getElementById('firstName').placeholder = t.firstNamePlaceholder;
    document.getElementById('lastName').placeholder = t.lastNamePlaceholder;
    document.getElementById('email').placeholder = t.emailPlaceholder;
    
    const btn = document.getElementById('submitBtn');
    if (!btn.disabled) btn.innerText = t.btnText;
  }
  async function requestAccess() {
    const t = translations[currentLang];
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('email').value.trim();
    
    const msgDiv = document.getElementById('statusMsg');
    const btn = document.getElementById('submitBtn');
  
    if (!firstName || !lastName || !email) {
      alert(t.fillAll);
      return;
    }
  
    btn.disabled = true;
    btn.innerText = t.btnLoading;
    msgDiv.style.display = 'none';
  
    try {
      const payload = JSON.stringify({ 
        firstName: firstName, 
        lastName: lastName, 
        email: email 
      });
  
      // Send via text/plain to bypass CORS preflight checks
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: payload
      });
  
      const data = await res.json();
  
      msgDiv.style.display = 'block';
      if (data.success) {
        msgDiv.className = "msg success";
        msgDiv.innerHTML = data.message;
      } else {
        msgDiv.className = "msg error";
        msgDiv.innerText = data.message;
        btn.disabled = false;
        btn.innerText = t.btnText;
      }
    } catch (e) {
      console.error("Detail chyby:", e);
      msgDiv.style.display = 'block';
      msgDiv.className = "msg error";
      msgDiv.innerText = t.netError;
      btn.disabled = false;
      btn.innerText = t.btnText;
    }
  }
}

  updateTexts();
</script>

</body>
</html>
