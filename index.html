<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Ing. Študijná Skupina – Prístup</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      background: #f0f2f5; 
      margin: 0; 
      padding: 20px;
      box-sizing: border-box;
    }

    .card { 
      background: white; 
      padding: 32px 28px 28px; 
      border-radius: 16px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
      width: 100%; 
      max-width: 420px; 
      box-sizing: border-box; 
      position: relative; 
      text-align: center;
    }

    /* --- Language Toggle Switch (Slider) --- */
    .lang-container {
      position: absolute;
      top: 18px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: bold;
      color: #666;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #075e54;
      transition: .3s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #25D366;
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* --- Form Elements --- */
    h2 { margin-top: 10px; color: #111; font-size: 22px; }
    p { color: #666; font-size: 14px; line-height: 1.4; margin-bottom: 24px; }
    
    input[type="text"], button { 
      width: 100%; 
      padding: 12px 14px; 
      margin-top: 12px; 
      border-radius: 8px; 
      border: 1px solid #ccd0d5; 
      box-sizing: border-box; 
      font-size: 14px; 
      text-align: left;
    }

    input[type="text"]:focus { 
      outline: none; 
      border-color: #075e54; 
      box-shadow: 0 0 0 3px rgba(7,94,84,0.12); 
    }

    button { 
      background: #075e54; 
      color: white; 
      font-weight: bold; 
      border: none; 
      cursor: pointer; 
      margin-top: 18px;
      text-align: center;
      transition: background 0.2s, transform 0.1s; 
    }

    button:hover { background: #054c44; }
    button:active { transform: scale(0.99); }
    button:disabled { background: #999; cursor: not-allowed; }

    .msg { margin-top: 18px; padding: 12px; border-radius: 8px; display: none; font-size: 14px; line-height: 1.4; text-align: left; }
    .error { background: #ffe6e6; color: #cc0000; border: 1px solid #ffcccc; }
    .success { background: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
    .success a { color: #075e54; font-weight: bold; word-break: break-all; }
  </style>
</head>
<body>

<div class="card">
  <!-- Language Toggle Slider -->
  <div class="lang-container">
    <span>SK</span>
    <label class="switch">
      <input type="checkbox" id="langToggle" onchange="toggleLanguage()">
      <span class="slider"></span>
    </label>
    <span>EN</span>
  </div>
  
  <h2 id="heading">Žiadosť o vstup do Ing. skupiny</h2>
  <p id="subheading">Zadajte svoje meno, priezvisko a telefónne číslo pre overenie a získanie odkazu.</p>
  
  <input type="text" id="firstName" placeholder="Krstné meno (napr. Ján)">
  <input type="text" id="lastName" placeholder="Priezvisko (napr. Novák)">
  <input type="text" id="phone" placeholder="WhatsApp telefón (+421...)">
  <button id="submitBtn" onclick="requestLink()">Získať odkaz na skupinu</button>

  <div id="statusMsg" class="msg"></div>
</div>

<script>
  // REPLACE WITH YOUR ACTUAL GOOGLE APPS SCRIPT WEB APP URL
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKmNCNEjMWU0n-xQhNDS_-FY0_dIT6cxvjr6wP_f5Qw3ltV50grutd5RRsYioEo2EJ/exec";

  let currentLang = 'sk';

  const translations = {
    sk: {
      title: "Ing. Študijná Skupina – Prístup",
      heading: "Žiadosť o vstup do Ing. skupiny",
      subheading: "Zadajte svoje meno, priezvisko a telefónne číslo pre overenie a získanie odkazu.",
      firstNamePlaceholder: "Krstné meno (napr. Ján)",
      lastNamePlaceholder: "Priezvisko (napr. Novák)",
      phonePlaceholder: "WhatsApp telefón (+421...)",
      btnText: "Získať odkaz na skupinu",
      btnLoading: "Overujem...",
      fillAll: "Prosím, vyplňte všetky polia.",
      netError: "Chyba pripojenia. Skúste to znova.",
      successMsg: (link) => `Úspech! Vaše telefónne číslo je zaevidované.<br><br>
          <a href="${link}" target="_blank"><b>Kliknite sem pre vstup do WhatsApp skupiny</b></a><br><br>
          <i>Poznámka: Administrátor schváli vašu žiadosť priamo vo WhatsAppe po overení.</i>`
    },
    en: {
      title: "Master's Study Group – Access",
      heading: "Master's Group Access Request",
      subheading: "Enter your first name, last name, and phone number to verify and get your link.",
      firstNamePlaceholder: "First Name (e.g. John)",
      lastNamePlaceholder: "Last Name (e.g. Doe)",
      phonePlaceholder: "WhatsApp Phone (+421...)",
      btnText: "Get Group Link",
      btnLoading: "Verifying...",
      fillAll: "Please fill in all fields.",
      netError: "Network error. Please try again.",
      successMsg: (link) => `Success! Your phone number is registered.<br><br>
          <a href="${link}" target="_blank"><b>Click here to join WhatsApp Group</b></a><br><br>
          <i>Note: An admin will approve your request inside WhatsApp once verified.</i>`
    }
  };

  function toggleLanguage() {
    const isChecked = document.getElementById('langToggle').checked;
    currentLang = isChecked ? 'en' : 'sk';
    updateTexts();
  }

  function updateTexts() {
    const t = translations[currentLang];
    document.getElementById('pageTitle').innerText = t.title;
    document.getElementById('heading').innerText = t.heading;
    document.getElementById('subheading').innerText = t.subheading;
    document.getElementById('firstName').placeholder = t.firstNamePlaceholder;
    document.getElementById('lastName').placeholder = t.lastNamePlaceholder;
    document.getElementById('phone').placeholder = t.phonePlaceholder;
    
    const btn = document.getElementById('submitBtn');
    if (!btn.disabled) btn.innerText = t.btnText;
  }

  async function requestLink() {
    const t = translations[currentLang];
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const fullName = `${firstName} ${lastName}`.trim();
    const phone = document.getElementById('phone').value.trim();
    
    const msgDiv = document.getElementById('statusMsg');
    const btn = document.getElementById('submitBtn');

    if (!firstName || !lastName || !phone) {
      alert(t.fillAll);
      return;
    }

    btn.disabled = true;
    btn.innerText = t.btnLoading;
    msgDiv.style.display = 'none';

    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ name: fullName, phone: phone })
      });
      const data = await res.json();

      msgDiv.style.display = 'block';
      if (data.success) {
        msgDiv.className = "msg success";
        msgDiv.innerHTML = t.successMsg(data.link);
      } else {
        msgDiv.className = "msg error";
        msgDiv.innerText = data.message;
        btn.disabled = false;
        btn.innerText = t.btnText;
      }
    } catch (e) {
      msgDiv.style.display = 'block';
      msgDiv.className = "msg error";
      msgDiv.innerText = t.netError;
      btn.disabled = false;
      btn.innerText = t.btnText;
    }
  }

  // Initialize
  updateTexts();
</script>

</body>
</html>
